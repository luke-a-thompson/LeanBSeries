name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    name: Build (lake)
    runs-on: ubuntu-latest
    steps:
      - name: Check out LeanBSeries
        uses: actions/checkout@v4
        with:
          path: lean-b-series

      - name: Build with Lake
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-b-series
          use-mathlib-cache: true
